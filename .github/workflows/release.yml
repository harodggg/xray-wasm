name: Release

# 打 tag 触发（例如 v0.1.0）。产出两样东西：
#   1) GitHub Release 附件：wasm 模块 + 校验和（给直接下载 wasm 的人）
#   2) 多架构容器镜像推到 GHCR（给 k8s 用）
#
# 关键设计：**镜像里的 wasm 与 Release 附件里的 wasm 是同一个文件**。
# 工作流先编译一次，然后既作为附件上传、又 COPY 进镜像。
# 若在镜像里重新编译，两者就可能不同步却都自称同一版本。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布时使用的 tag（例如 v0.1.0）'
        required: true

# 创建 Release 需要 contents: write；推镜像需要 packages: write（在 image job 上单独声明）。
# 很多仓库的默认 token 权限是只读，不显式声明的话 action-gh-release 会 403。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 与 ci.yml 同理：CARGO_* 与 XW_* 必须指向同一处，否则缓存静默失效。
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  XW_CARGO_HOME: ${{ github.workspace }}/.cargo-home
  XW_TARGET_DIR: ${{ github.workspace }}/target
  WASMTIME_VERSION: v48.0.2
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 发布前必须先把 CI 的那套检查跑一遍 —— 不能从一个未验证的提交发版。
  verify:
    name: 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 与 ci.yml 一样调用 scripts/check.sh，而不是在这里手抄一遍步骤。
      # 手抄过一次就会漂移一次：发版路径上的检查比 CI 更不该有独立实现。
      - name: 跑全部检查（与 CI 同一条命令）
        run: ./scripts/check.sh

  wasm:
    name: 构建 wasm 包
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 构建
        run: cargo build -p xt-wasm-cli --release --target wasm32-wasip2

      - name: 整理发布产物（含校验和）
        id: hash
        run: |
          set -eux
          mkdir -p dist
          WASM="$XW_TARGET_DIR/wasm32-wasip2/release/xt-wasm-cli.wasm"
          cp "$WASM" dist/xt-wasm-cli.wasm
          # 校验和：让下载者能确认拿到的字节与 CI 构建的一致
          ( cd dist && sha256sum xt-wasm-cli.wasm > xt-wasm-cli.wasm.sha256 )
          cat dist/xt-wasm-cli.wasm.sha256
          SIZE=$(stat -c%s dist/xt-wasm-cli.wasm)
          echo "wasm 体积: $SIZE 字节"
          echo "sha256=$(cut -d' ' -f1 dist/xt-wasm-cli.wasm.sha256)" >> "$GITHUB_OUTPUT"

      - name: 上传产物（供 image job 使用，保证镜像与附件同源）
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: dist/
          if-no-files-found: error

  image:
    name: 构建并推送容器镜像（k8s 用）
    runs-on: ubuntu-latest
    needs: wasm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 取回同一个 wasm 产物
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: 放进 Docker 构建上下文
        run: cp dist/xt-wasm-cli.wasm ./xt-wasm-cli.wasm

      - name: 设置 QEMU（arm64 交叉构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 冒烟：镜像的 ENTRYPOINT/args 管道是整个交付里最容易静默出错的一环 ——
      # wasmtime 的 exec 形式 ENTRYPOINT 以 wasm 路径结尾，`server` 必须能被
      # 追加成 guest 的 argv[1]。这条管道错了的话，镜像「构建成功、能启动」，
      # 但 k8s 清单里的 `args: ["server"]` 会静默变成客户端模式。
      #
      # 用单架构 load 到本地，两个模式各断言一次，通过后再做多架构推送。
      - name: 本地构建单架构镜像（供冒烟用）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: xw-release-smoke:local
          build-args: |
            WASMTIME_VERSION=${{ env.WASMTIME_VERSION }}

      - name: 冒烟：两种模式都必须能到达 guest
        run: |
          set -eu
          # 客户端模式（无子命令）：缺 --server 的报错必须来自客户端参数解析
          out=$(docker run --rm xw-release-smoke:local 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '缺少 --server' \
            || { echo "镜像默认模式不是客户端"; exit 1; }

          # 服务端模式：args 里的 server 必须真的传进 guest
          out=$(docker run --rm xw-release-smoke:local server 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '缺少 --private-key' \
            || { echo "镜像里 server 子命令没有生效"; exit 1; }

          # 服务端模式也接受 XT_MODE=server（不写 args 的部署方式）
          out=$(docker run --rm -e XT_MODE=server xw-release-smoke:local 2>&1 || true)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '缺少 --private-key' \
            || { echo "XT_MODE=server 没有生效"; exit 1; }

          echo "冒烟通过：客户端模式、server 子命令、XT_MODE 都能到达 guest"

      - name: 生成标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 发布即打 latest（tag 推送不属于默认分支，用 is_default_branch 不会生效）
            type=raw,value=latest

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WASMTIME_VERSION=${{ env.WASMTIME_VERSION }}
          provenance: true
          sbom: true

      - name: 摘要
        run: |
          {
            echo "### 容器镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "wasm SHA-256: \`${{ needs.wasm.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 创建 Release 放在最后，且 needs 两个前置 job。
  #
  # 原来的顺序是 wasm job 里建完 Release 再去建镜像 —— 镜像那一步失败时，
  # Release 已经发出去了，而 README 和 k8s 清单都在告诉用户去拉那个镜像。
  # 「先发公告再验证」正是发版流程最不该有的顺序。
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [wasm, image]
    permissions:
      contents: write   # 创建 Release 需要；仓库默认 token 常是只读
    steps:
      - uses: actions/checkout@v4

      - name: 取回 wasm 与校验和
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist

      - name: 核对校验和（附件与镜像用的是同一份产物）
        run: |
          set -eux
          cd dist
          sha256sum -c xt-wasm-cli.wasm.sha256
          test "$(cut -d' ' -f1 xt-wasm-cli.wasm.sha256)" = "${{ needs.wasm.outputs.sha256 }}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            ## 产物

            | 文件 | 说明 |
            |---|---|
            | `xt-wasm-cli.wasm` | wasm32-wasip2 模块（wasmtime 直接可跑） |
            | `xt-wasm-cli.wasm.sha256` | 上述文件的 SHA-256 |

            wasm 模块 SHA-256：`${{ needs.wasm.outputs.sha256 }}`

            同一个模块跑**两种模式**：默认是客户端（socket → REALITY），
            `server` 子命令是服务端（REALITY 入站）。

            ## 客户端：本地 SOCKS5 → REALITY 隧道

            ```sh
            wasmtime run -C cache=n \
              -S tcp=y -S inherit-network=y -S allow-ip-name-lookup=y -S inherit-env=y \
              xt-wasm-cli.wasm \
              --server <ip:port> --pbk <公钥> --sid <shortId> \
              --sni <伪装域名> --uuid <uuid> --listen 127.0.0.1:1080
            ```

            ## 服务端：REALITY 入站（k3s 用）

            ```sh
            wasmtime run -C cache=n \
              -S tcp=y -S inherit-network=y -S allow-ip-name-lookup=y -S inherit-env=y \
              xt-wasm-cli.wasm server \
              --listen 0.0.0.0:8443 \
              --private-key <xray x25519 的 PrivateKey> \
              --short-ids <hex> \
              --server-names <伪装域名> \
              --dest <同一个域名的 host:port> \
              --users <uuid>
            ```

            全部参数都有对应的 `XT_*` 环境变量（命令行优先），便于 k8s 用 Secret 注入。

            ## 互操作（四种组合都通）

            | 客户端 | 服务端 | 结果 |
            |---|---|---|
            | 官方 Xray（v2rayN / 小火箭 / `xray` 二进制） | 本工程 wasm 服务端 | ✅ `flow: "xtls-rprx-vision"` 直接可用 |
            | 本工程 wasm 客户端（默认，带 Vision） | 官方 Xray 服务端 | ✅ |
            | 本工程 wasm 客户端（默认，带 Vision） | 本工程 wasm 服务端 | ✅ |
            | 本工程 wasm 客户端 `--no-flow` | 本工程 wasm 服务端 | ✅ |

            > 不认识的 `flow` 名仍会被**明确拒绝**，不会静默降级。
            > `--no-flow`（或 `XT_NO_FLOW=1`）只在「对端只认空 flow」时需要 ——
            > 它同时关掉 flow 声明和客户端侧 Vision 分帧，两者必须同进同退
            > （只关一半会得到「连上了但数据是坏的」）。

            ## 服务端 XTLS-Vision（本版新增）

            服务端现在**双向**实现了 XTLS-Vision 流控（解帧 + 组帧），官方客户端
            带 `flow: "xtls-rprx-vision"` 经本服务端取真实网页拿到 HTTP 200：

            ```
            [server] ts=… dir=in sni=www.cloudflare.com ver=26.3.27 target=example.com:443 \
                     outcome=Forwarded dur_ms=1022 up_bytes=578 down_bytes=4894
            ```

            两个关键语义（都写进了单测，改回去立刻变红）：
            * 收到对端的 `DIRECT` **只切读侧**，写侧必须继续组帧直到我们自己发终止帧；
            * `DIRECT` 帧的 padding 走完之前不能去读内层（否则会拿裸字节喂外层 TLS）。

            ## 服务端可观测性

            一次请求一行，字段固定；`outcome=` 取值
            `Forwarded | FellBack | Rejected | ResolveFailed | ConnectFailed`（外加 `Error`）：

            ```
            [server] ts=2026-09-15T11:41:12Z dir=in src=10.0.0.5:51234 sni=www.example.com \
                     ver=26.3.27 sid=0011223344556677 target=example.com:443 outcome=Forwarded \
                     dur_ms=1320 up_bytes=585 down_bytes=4867
            ```

            配置自检（**不监听**，只打印生效配置并退出）：

            ```sh
            XT_CHECK=1 <上面的 XT_* 变量> wasmtime run … xt-wasm-cli.wasm server
            ```

            > ⚠️ **wasmtime 会把 guest 的退出码塌缩成 1**（实测 `exit(2)`/`exit(42)` 都得到 1）。
            > `--check` 的契约可观察到的只有 **0 / 非 0**；写成 `== 2` 的断言在宿主上过、
            > 在 wasm 上必红。

            > 四个 `-S` flag 缺一不可。尤其 `inherit-network=y` 缺失时报的是
            > `PermissionDenied`，很容易被误读成「网络被墙」。
            > `inherit-env=y` 是安全相关的：缺了它，凭据无法通过环境变量传入。

            ## 容器镜像（k8s）

            ```
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ```

            ```sh
            # 客户端
            docker run --rm -e XT_SERVER=… -e XT_PBK=… ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }}
            # 服务端（子命令写在镜像名之后）
            docker run --rm -e XT_PRIVATE_KEY=… ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag || github.ref_name }} server
            ```

            部署清单（客户端与服务端各一套）与安全须知见仓库 `deploy/k8s/`。

            ## 校验

            ```sh
            sha256sum -c xt-wasm-cli.wasm.sha256
            ```
          files: |
            dist/xt-wasm-cli.wasm
            dist/xt-wasm-cli.wasm.sha256
