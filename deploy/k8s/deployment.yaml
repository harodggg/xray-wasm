# xray-wasm 作为集群内共享出口代理的 Deployment。
#
# 前置：先创建 Secret（见 secret.example.yaml）
#
# 实现是单线程非阻塞多路复用（wasip2 无线程），并发上限 64，一条长连接不会独占 Pod。
# 仍建议先读 deploy/k8s/README.md 的「已知限制」。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-wasm
  labels:
    app.kubernetes.io/name: xray-wasm
spec:
  # 单个 Pod 已能处理最多 64 条并发连接；replicas ≥2 的意义在于
  # 可用性（滚动更新不中断）与横向扩容，而不是绕开单连接限制。
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xray-wasm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xray-wasm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/harodggg/xray-wasm:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # 必须绑 0.0.0.0 才能被其它 Pod 通过 Service 访问。
            # 镜像默认是 127.0.0.1（安全默认值），这里显式放开。
            # 同时 Secret 里必须配了认证 —— 否则这就是一个开放代理，
            # 客户端启动时会打印显式警告。
            - name: XT_LISTEN
              value: "0.0.0.0:1080"
          envFrom:
            - secretRef:
                name: xray-wasm
          ports:
            - name: socks
              containerPort: 1080
              protocol: TCP
          # 探针说明：
          # 实现是非阻塞多路复用的，探针连接不会排在长连接后面，所以三个探针都能正常用。
          # 探针本身会占用一个并发槽位（上限 64），可忽略；并配有 XT_HANDSHAKE_TIMEOUT
          # 兜底，即使探针连上不发数据也会被及时回收。
          startupProbe:
            tcpSocket:
              port: socks
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: socks
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: socks
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
