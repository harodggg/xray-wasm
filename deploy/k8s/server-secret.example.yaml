# REALITY 服务端的 Secret 示例。
#
# **不要把这个文件填好后提交。** 复制到集群外的地方填，然后：
#
#     kubectl -n <命名空间> apply -f <你填好的副本>
#     rm <你填好的副本>
#
# 或者干脆不进文件（推荐，密钥不落盘、不进 shell 历史）：
#
#     kubectl -n <命名空间> create secret generic xray-wasm-server \
#       --from-literal=XT_PRIVATE_KEY="$(xray x25519 | sed -n 's/^PrivateKey: *//p')" \
#       --from-literal=XT_SHORT_IDS="$(openssl rand -hex 8)" \
#       --from-literal=XT_SERVER_NAMES='www.example.com' \
#       --from-literal=XT_DEST='www.example.com:443' \
#       --from-literal=XT_USERS="$(uuidgen | tr 'A-Z' 'a-z')"
#
# 为什么必须是 Secret 而不是写进 Deployment 的 args：
# `kubectl describe pod` 会把 args 原样打印，`kubectl get deploy -o yaml` 也是。
# 环境变量 + Secret 至少需要额外的 RBAC 才能读到（`get secret`）。
#
# ── 每个字段怎么来 ──────────────────────────────────────────────
#
# XT_PRIVATE_KEY   `xray x25519` 输出里的 **PrivateKey** 那一行（base64url，不需要补 `=`）。
#                  对应的 Client 端要填同一份输出的 `Password (PublicKey)`。
#                  ⚠️ 用户名和公钥那一行极易看反；填反的症状是「客户端握手后
#                  看到一个不属于自己 dest 的证书」，非常难查。
#
# XT_SHORT_IDS     逗号分隔的 hex，**长度必须是偶数且 ≤ 16 个字符**。
#                  客户端填的 shortId 必须在这个列表里。
#                  空 shortId（`XT_SHORT_IDS=""`）是被明确拒绝的 —— 那会让任何
#                  知道公钥的人都能通过 REALITY 认证。
#
# XT_SERVER_NAMES  逗号分隔的 SNI 白名单。客户端 `serverName` 必须命中其一。
#                  这里填的域名**必须和 XT_DEST 指向同一个真实站点**，
#                  否则会自相矛盾：认证失败时我们回退到 dest，探测者会拿到
#                  dest 的证书，而证书上的域名却不是它请求的 SNI —— 等于自曝。
#                  例如两个都填 www.example.com。
#
# XT_DEST          认证失败时的回落目标 `host:port`，应当是一个**真实存在、
#                  且证书与 XT_SERVER_NAMES 匹配**的 TLS 站点。
#                  它是 REALITY 抗主动探测能力的来源，不要指向本机服务。
#
# XT_USERS         逗号分隔的 VLESS UUID（标准 8-4-4-4-12 形式，大小写不敏感）。
#                  可以放多个，便于按人吊销：删掉一个 UUID 滚动更新即可。
apiVersion: v1
kind: Secret
metadata:
  name: xray-wasm-server
  labels:
    app.kubernetes.io/name: xray-wasm-server
type: Opaque
stringData:
  XT_PRIVATE_KEY: "<REPLACE: xray x25519 的 PrivateKey>"
  XT_SHORT_IDS: "<REPLACE: openssl rand -hex 8>"
  XT_SERVER_NAMES: "<REPLACE: 伪装域名，如 www.example.com>"
  XT_DEST: "<REPLACE: 同一个域名的 host:port，如 www.example.com:443>"
  XT_USERS: "<REPLACE: uuidgen 生成的 UUID，可逗号分隔多个>"
