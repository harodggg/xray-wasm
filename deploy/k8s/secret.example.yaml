# 一次性创建 Secret 的示例。
#
# ⚠️ **不要把这个文件填上真实值后提交。** 它只是给你看字段结构，
#    实际请用下面的命令直接写进集群：
#
#     kubectl create secret generic xray-wasm \
#       --namespace <你的命名空间> \
#       --from-literal=XT_UUID='<你的 UUID>' \
#       --from-literal=XT_PBK='<服务端 X25519 公钥 base64url>' \
#       --from-literal=XT_SID='<shortId hex>' \
#       --from-literal=XT_SNI='<伪装域名>' \
#       --from-literal=XT_SERVER='<服务端 ip:port>' \
#       --from-literal=XT_SOCKS_USER='<代理用户名>' \
#       --from-literal=XT_SOCKS_PASS='<代理密码>'
#
# 为什么凭证走 Secret 而不是写在 args 里：
# `kubectl describe pod` 会把 args 原样打印出来，等于把 UUID 摊在终端历史和工单里；
# Secret 注入的环境变量在 describe 里只显示引用名，不显示值。
apiVersion: v1
kind: Secret
metadata:
  name: xray-wasm
type: Opaque
stringData:
  # VLESS 用户 UUID（服务端 settings.clients[].id）
  XT_UUID: "REPLACE_ME"
  # REALITY 服务端 X25519 公钥（base64url，来自 `xray x25519` 的 Password 行）
  XT_PBK: "REPLACE_ME"
  # REALITY shortId（hex）
  XT_SID: "REPLACE_ME"
  # REALITY 伪装域名（必须与服务端 serverNames 中的一项一致）
  XT_SNI: "REPLACE_ME"
  # 服务端地址 ip:port
  XT_SERVER: "REPLACE_ME"
  # ---- 以下是「代理自身」的访问认证，不是服务端的 ----
  # ⚠️ 强烈建议设置：留空则任何能连上该端口的 Pod 都能白嫖你的隧道（开放代理）
  XT_SOCKS_USER: "REPLACE_ME"
  XT_SOCKS_PASS: "REPLACE_ME"
