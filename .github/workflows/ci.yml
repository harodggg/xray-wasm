name: CI

# 每次 push / PR 都跑。这里刻意把「真实端到端」也纳入常规 CI：
# 本工程踩过的两个最贵的坑（server flight 被合并进一条记录、
# ClientVer 被服务端校验）都是**单元测试全绿**但对接真实服务端才暴露的。
# 只跑单元测试的 CI 会放过它们。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 这两组变量必须指向**同一个地方**：
  #   CARGO_*   给直接调用的 cargo 用（build job 没有 source env.sh）
  #   XW_*      给 env.sh 用（e2e job 里脚本会 source 它，见 scripts/env.sh）
  # 只设其中一组的话，cargo 的落点与缓存路径会不一致，缓存静默失效。
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  XW_CARGO_HOME: ${{ github.workspace }}/.cargo-home
  XW_TARGET_DIR: ${{ github.workspace }}/target
  WASMTIME_VERSION: v48.0.2
  XRAY_VERSION: v26.3.27
  XRAY_ASSET: Xray-linux-64.zip

jobs:
  # ── 静态检查 + 单元测试 + wasm 构建 ──
  build:
    name: 构建与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32-wasip2）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 所有静态检查都收敛到 scripts/check.sh —— 本地与 CI 跑的是同一条命令，
      # 不会出现「本地觉得跑过了、CI 却红」这种漂移。
      # 这里只保留「产物上传」这类 CI 专属的步骤在外。
      - name: 跑全部检查（与本地同一条命令）
        run: ./scripts/check.sh

      - name: 上传 wasm 产物
        uses: actions/upload-artifact@v4
        with:
          name: xt-wasm-cli.wasm
          path: ${{ env.XW_TARGET_DIR }}/wasm32-wasip2/release/xt-wasm-cli.wasm
          if-no-files-found: error

  # ── 真实端到端：wasm 客户端 → 真实 Xray REALITY 服务端 → 外网 ──
  e2e:
    name: 端到端（真实 Xray REALITY 服务端）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32-wasip2）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装 e2e 依赖（nc 探端口；python3 跑并发用例的辅助脚本）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netcat-openbsd python3

      - name: 下载 wasmtime
        run: |
          set -eux
          curl -fsSL -o /tmp/wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME"
          echo "WASMTIME_BIN=$HOME/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      - name: 下载 Xray-core（服务端基准）
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.xray"
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}"
          unzip -q -o /tmp/xray.zip -d "$GITHUB_WORKSPACE/.xray"
          chmod +x "$GITHUB_WORKSPACE/.xray/xray"
          echo "XW_XRAY_BIN=$GITHUB_WORKSPACE/.xray/xray" >> "$GITHUB_ENV"

      - name: 构建 wasm
        run: cargo build -p xt-wasm-cli --release --target wasm32-wasip2

      - name: 生成一次性测试服务端
        run: ./scripts/gen-test-server.sh

      - name: 端到端
        run: |
          set -eu
          . .test-server/params.env
          XW_XRAY_DIR="$PWD/.test-server" ./scripts/e2e-test.sh

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "===== 服务端日志 ====="
          cat .e2e-server.log 2>/dev/null || echo "(无)"
          echo "===== 客户端日志 ====="
          cat .e2e-client.log 2>/dev/null || echo "(无)"

  # ── 真实端到端（反方向）：真实 Xray 客户端 → 我们的 wasm REALITY 服务端 → 外网 ──
  #
  # 与上一个 job 是镜像关系，两边都必须常态化跑：
  # 「客户端能连上别人的服务端」和「我们的服务端能被别人的客户端连上」
  # 是两组完全不同的实现，任何一侧的回归都不该靠另一侧兜住。
  e2e-server:
    name: 端到端（我们的 wasm REALITY 服务端）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32-wasip2）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # openssl 用来做「抗主动探测」那条用例：未认证的 TLS 探测者
      # 必须看到 dest 的真实证书，而不是我们伪造的 Ed25519 证书。
      - name: 安装 e2e 依赖（nc；python3 生成凭据；openssl 做探测）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netcat-openbsd python3 openssl

      - name: 下载 wasmtime
        run: |
          set -eux
          curl -fsSL -o /tmp/wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME"
          echo "WASMTIME_BIN=$HOME/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      - name: 下载 Xray-core（客户端基准）
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.xray"
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}"
          unzip -q -o /tmp/xray.zip -d "$GITHUB_WORKSPACE/.xray"
          chmod +x "$GITHUB_WORKSPACE/.xray/xray"
          echo "XW_XRAY_BIN=$GITHUB_WORKSPACE/.xray/xray" >> "$GITHUB_ENV"

      - name: 构建 wasm
        run: cargo build -p xt-wasm-cli --release --target wasm32-wasip2

      - name: 端到端（服务端方向）
        run: ./scripts/e2e-server-test.sh

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "===== wasm 服务端日志 ====="
          cat .e2e-srv-wasm.log 2>/dev/null || echo "(无)"
          echo "===== stock 客户端日志 ====="
          cat .e2e-srv-client.log 2>/dev/null || echo "(无)"
          echo "===== 错误 UUID 客户端日志 ====="
          cat .e2e-srv-bad.log 2>/dev/null || echo "(无)"

  # ── 真实端到端（自环）：我们的 wasm 客户端 → 我们的 wasm 服务端 ──
  #
  # 前三道题各自只覆盖一半，这一道是唯一两端都是本工程的组合。
  # 它第一次跑就会暴露真问题：客户端默认发 Vision，服务端不实现 Vision 流控。
  e2e-wasm-to-wasm:
    name: 端到端（wasm 客户端 → wasm 服务端）
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 wasm32-wasip2）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.XW_CARGO_HOME }}
            ${{ env.XW_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # curl 打隧道；nc 探端口；python3 生成凭据。xray 只用来跑 `x25519` 生成密钥对。
      - name: 安装 e2e 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends netcat-openbsd python3 curl

      - name: 下载 wasmtime
        run: |
          set -eux
          curl -fsSL -o /tmp/wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME"
          echo "WASMTIME_BIN=$HOME/wasmtime-${WASMTIME_VERSION}-x86_64-linux/wasmtime" >> "$GITHUB_ENV"

      - name: 下载 Xray-core（只为 x25519 生成密钥）
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/.xray"
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}"
          unzip -q -o /tmp/xray.zip -d "$GITHUB_WORKSPACE/.xray"
          chmod +x "$GITHUB_WORKSPACE/.xray/xray"
          echo "XW_XRAY_BIN=$GITHUB_WORKSPACE/.xray/xray" >> "$GITHUB_ENV"

      - name: 构建 wasm
        run: cargo build -p xt-wasm-cli --release --target wasm32-wasip2

      - name: 端到端（wasm↔wasm）
        run: ./scripts/e2e-wasm-to-wasm-test.sh

      - name: 失败时输出日志
        if: failure()
        run: |
          echo "===== wasm 服务端日志 ====="
          cat .e2e-w2w-srv.log 2>/dev/null || echo "(无)"
          echo "===== wasm 客户端日志 ====="
          cat .e2e-w2w-cli.log 2>/dev/null || echo "(无)"
          echo "===== 反向用例客户端日志 ====="
          cat .e2e-w2w-cli-bad.log 2>/dev/null || echo "(无)"
