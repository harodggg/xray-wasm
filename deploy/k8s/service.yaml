# 集群内访问入口。
#
# 刻意保持 ClusterIP：**不要**改成 LoadBalancer 或 NodePort。
# 这是个 SOCKS5 代理，暴露到集群外意味着任何人都能用你的隧道出网，
# 流量与责任都算在你头上。确需集群外访问时，请走 Ingress + 认证 + 来源限制，
# 并先想清楚是不是真的需要。
apiVersion: v1
kind: Service
metadata:
  name: xray-wasm
  labels:
    app.kubernetes.io/name: xray-wasm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xray-wasm
  ports:
    - name: socks
      port: 1080
      targetPort: socks
      protocol: TCP
