[workspace]
resolver = "2"
members = [
    "crates/xt-wasm-tls",
    "crates/xt-wasm-vless",
    "crates/xt-wasm-runtime",
    "crates/xt-wasm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VLESS + XTLS-Vision + REALITY client compiled to wasm32-wasip2"

[workspace.dependencies]
# ── 密码学（纯 Rust，wasip2 可用；已实测）─────────────────────────
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
rand = "0.8"
rand_chacha = "0.3"
zeroize = "1"
subtle = "2"

# ── IO / 异步（只取 trait 与工具，不引入 runtime）────────────────
tokio = { version = "1", default-features = false, features = ["io-util"] }
futures = "0.3"
bytes = "1"

# ── 杂项 ────────────────────────────────────────────────────────
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"

# WASI 0.2 的异步标准库（Bytecode Alliance 官方）：提供原始 wasi:sockets
# 访问、基于 pollable 的事件循环与定时器。**仅 wasm 目标使用。**
wstd = "0.6"

# ── 内部 crate ──────────────────────────────────────────────────
xt-wasm-runtime = { path = "crates/xt-wasm-runtime" }
xt-wasm-tls = { path = "crates/xt-wasm-tls" }
xt-wasm-vless = { path = "crates/xt-wasm-vless" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
